<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A y E</title>
    <style>
        /* Reiniciamos márgenes */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; /* Fondo negro absoluto */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Estructura para centrar de forma robusta */
        .tabla-centrado {
            display: table;
            width: 100%;
            height: 100%;
        }

        .celda-centrado {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
            padding: 20px;
        }

        .mensaje-contenedor {
            display: inline-block;
            animation: fadeIn 3s ease-in-out; /* Efecto suave de aparición */
        }

        h1 {
            font-size: 2.5rem;
            color: #ffffff; /* Texto blanco */
            font-weight: 300; /* Letra fina y elegante */
            letter-spacing: 2px;
            margin: 0 0 15px 0;
        }

        .fecha {
            font-size: 1.3rem;
            color: #a0a0a0; /* Blanco suave / gris claro para que contraste bonito */
            font-style: italic; /* Texto en cursiva */
            font-weight: 300;
            letter-spacing: 3px;
            margin: 0;
            display: block;
        }

        /* Animación de aparición gradual (Fade In) */
        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(15px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        /* Ajuste para pantallas pequeñas (móviles) */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
                letter-spacing: 1px;
            }
            .fecha {
                font-size: 1.1rem;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <div class="tabla-centrado">
        <div class="celda-centrado">
            <div class="mensaje-contenedor">
                <h1>ahora juntos para siempre</h1>
                <span class="fecha">13-02-26</span>
            </div>
        </div>
    </div>

</body>
</html>
