<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Siempre</title>
    <style>
        /* Estilos para centrar todo y darle un toque elegante */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fcf9f5; /* Un tono crema suave y cálido */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .mensaje-contenedor {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: #5c4d43; /* Un color marrón sutil, nada agresivo */
            font-weight: 300; /* Letra fina y elegante */
            letter-spacing: 1px;
            margin: 0;
            animation: fadeIn 2.5s ease-in-out; /* Efecto suave al cargar */
        }

        /* Animación para que el texto aparezca poco a poco */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="mensaje-contenedor">
        <h1>ahora juntos para siempre</h1>
    </div>

</body>
</html>
